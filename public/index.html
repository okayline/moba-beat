<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>moba-beat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <span class="mark">moba-beat<span class="version" id="version"></span></span>
    <span class="right"><span class="date" id="date"></span><button class="link" id="acct" type="button">Account</button></span>
  </header>
  <section class="account" id="account" hidden></section>

  <main>
    <section class="fight" aria-label="The fight">
      <div class="bars">
        <div class="bar you"><div class="who"><span>You</span><span id="hp0">10</span></div><div class="life"><i id="life0"></i></div><div class="meter" id="meter0"></div></div>
        <div class="bar ghost"><div class="who"><span>Ghost</span><span id="hp1">10</span></div><div class="life"><i id="life1"></i></div><div class="meter" id="meter1"></div></div>
      </div>
      <div>
        <p class="call" id="call"></p>
        <p class="result" id="result" role="status"></p>
      </div>
      <div class="lamps" aria-hidden="true">
        <span class="num">1</span><span class="num">2</span><span class="num">3</span><span class="num">4</span>
        <span id="l0"></span><span id="l1"></span><span id="l2"></span><span id="l3" class="four"></span>
      </div>
      <button class="pad" id="pad" type="button">Press / hold</button>
    </section>
    <div class="controls">
      <button class="play" id="play" type="button" disabled>Start fight</button>
      <p class="bpm"><span id="style" class="style"></span> <span id="bpm">–</span> BPM</p>
    </div>
    <p class="status" id="status" role="status"></p>

    <section class="moves" aria-labelledby="moves-title">
      <h2 id="moves-title">Moves</h2>
      <div class="guide" id="guide"></div>
      <p class="key"><span><i class="k-tap"></i>tap</span><span><i class="k-hold"></i>press and hold</span><span><i class="k-four"></i>beat 4</span></p>
    </section>

    <section class="log-sec" aria-labelledby="log-title">
      <h2 id="log-title">What happened</h2>
      <ol class="log" id="log"></ol>
    </section>
  </main>

  <footer class="foot">
    <p><a href="ledger.html">See the ledger</a></p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
