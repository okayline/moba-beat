<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>moba-beat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <span class="mark">moba-beat<span class="version" id="version"></span></span>
    <span class="right"><span class="date" id="date"></span><button class="link" id="acct" type="button">Account</button></span>
  </header>
  <section class="account" id="account" hidden></section>

  <main>
    <section class="arena" aria-label="The lane">
      <div class="side you">
        <p class="team">Your squad</p>
        <div class="units" id="you"></div>
      </div>
      <div class="mid" aria-hidden="true"></div>
      <div class="side ghost">
        <p class="team">Ghost squad</p>
        <div class="units" id="ghost"></div>
      </div>
    </section>

    <section class="beat" aria-labelledby="beat-title">
      <div class="beat-head">
        <h1 id="beat-title">Today's beat</h1>
        <p class="bpm"><span id="style" class="style"></span> <span id="bpm">–</span> BPM</p>
      </div>
      <div id="reveal" hidden>
      <ol class="track" id="track" aria-label="The drums: 8 measures"></ol>
      <ul class="legend">
        <li><span class="key cue"></span>Enemy winds up</li>
        <li><span class="key parry"></span>Parry, 2 beats later</li>
        <li><span class="key hat"></span>Hi-hat</li>
        <li><span class="key snare"></span>Snare</li>
        <li><span class="key kick"></span>Kick</li>
        <li><span class="key target"></span>Your clap, on beat 4</li>
      </ul>
      </div>
      <div class="controls">
        <button class="play" id="play" type="button" disabled>Play</button>
        <button class="tap" id="tap" type="button" disabled>Tap</button>
        <p class="count" id="count" aria-live="polite"></p>
      </div>
      <p class="status" id="status" role="status"></p>
      <ol class="results" id="results"></ol>
      <p class="status" id="sealed"></p>
    </section>
  </main>

  <footer class="foot">
    <p><a href="ledger.html">See the ledger</a></p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
